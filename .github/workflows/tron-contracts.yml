name: TRON Nile contract compile

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/tron-contracts.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/tron-contracts.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run compile
      - run: npm run test
      - run: node --check migrations/deploy.js && node --check scripts/verify-nile.js
      - name: Capture dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable})).sort((x,y)=>({critical:0,high:1,moderate:2,low:3}[x.severity]-({critical:0,high:1,moderate:2,low:3}[y.severity]))).slice(0,40)},null,2))'
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: ftusdt-dependency-audit
          path: backend/npm-audit.json
          retention-days: 30
