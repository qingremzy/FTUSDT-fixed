name: Solidity compile

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/solidity.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/solidity.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile TRON contracts
        run: npm run compile
