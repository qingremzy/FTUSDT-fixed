name: Frontend and contract validation
on:
  push:
    branches:
      - fix/wallet-safety-and-decimals
  pull_request:
    branches:
      - fix/wallet-safety-and-decimals
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check tronbox.js && node --check migrations/deploy.js && node --check migrations/2_deploy_contracts.js
      - run: npm install --no-audit --no-fund
      - run: npx tronbox compile
